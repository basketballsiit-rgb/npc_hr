name: Deploy NPC HR

# สั่งให้ทำงานทุกครั้งที่มีการ Push โค้ดมาที่เส้นทาง main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: เชื่อมต่อเซิร์ฟเวอร์และอัปเดตระบบ
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        # คำสั่งรันบนเซิร์ฟเวอร์เพื่อทำการอัปเดตระบบและรีสตาร์ต PM2
        script: |
          if [ -d "/var/www/html/npc_hr" ]; then
            cd /var/www/html/npc_hr
            git pull origin main
            npm install
          fi
          if [ -d "/var/www/html/npc_eleve_backend" ]; then
            cd /var/www/html/npc_eleve_backend
            git pull origin main
            npm install
          fi
          if [ -d "/var/www/npc_hr" ]; then
            cd /var/www/npc_hr
            git pull origin main
            npm install
          fi
          if pm2 describe npc_hr >/dev/null 2>&1; then
            pm2 restart npc_hr
          elif pm2 describe npc_eleve_backend >/dev/null 2>&1; then
            pm2 restart npc_eleve_backend
          else
            pm2 restart all || pm2 start backend/server.js --name npc_hr
          fi
          pm2 save
